<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Lab Survey</title>
    <meta
      name="description"
      content="A SurveyJS survey for station rooms: everyone in the room can answer, the station stores the answers and charts them. <a href='https://github.com/edrys-labs/module-survey' target='_blank'>GitHub</a>"
    />
    <meta name="show-in" content="station" />
    <meta name="icon" content="mdi-clipboard-text-outline" />
    <meta
      name="module-config"
      content="{
        'stationConfig': {
          'survey': {
            'type': 'code-area',
            'hint': 'Your survey as SurveyJS JSON (see surveyjs.io/create-free-survey)'
          },
          'allowRetake': {
            'type': 'boolean',
            'hint': 'Let a user take the survey again after submitting (Off: one answer per user)'
          }
        }
      }"
    />

    <script src="https://edrys-labs.github.io/module/edrys.js"></script>

    <!-- Dexie.js for IndexedDB -->
    <script
      src="https://unpkg.com/dexie@4.4.6/dist/dexie.js"
      integrity="sha384-sCkAT2j+AZTFdO8/jKW00smf64uZeyOZ4vEJdzqPVASnK8oJGx+87g6GvhWY9448"
      crossorigin="anonymous"
    ></script>

    <link
      rel="stylesheet"
      href="https://edrys-labs.github.io/module/vendor/water.min.css"
    />
    <link
      rel="stylesheet"
      href="https://edrys-labs.github.io/module/vendor/open-iconic/css/open-iconic.min.css"
    />

    <!-- SurveyJS Core and UI, light and dark theme (picked by the OS preference) -->
    <link
      rel="stylesheet"
      href="https://unpkg.com/survey-core@2.5.44/survey-core.min.css"
      integrity="sha384-wB+G4wKAGGMOFdS4/XogiaJ+M1cb+RqFIbFlmYS0Z9HzMqjh0UyN2r7omvwIGX/K"
      crossorigin="anonymous"
    />
    <script
      src="https://unpkg.com/survey-core@2.5.44/survey.core.min.js"
      integrity="sha384-18PuW0vFFCpuwL+scF7blD9foucIXPgxuA5t6DSGhbJLFZBlmB0QUwKCDXOt6nZ/"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://unpkg.com/survey-js-ui@2.5.44/survey-js-ui.min.js"
      integrity="sha384-g/0QNG4+C36pAjsfDJPZUrnJFFVDsafA6RpPl6/Mx3XNF/PmrWtbtxls34y41Dgq"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://unpkg.com/survey-core@2.5.44/themes/default-light.min.js"
      integrity="sha384-xyByTCpnvxuC0csPhI+mIJYTqZBR54A4DG1DQgEO7DUTRbbfMOF7MAPhILF9fI7P"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://unpkg.com/survey-core@2.5.44/themes/default-dark.min.js"
      integrity="sha384-kwqv7GEDdvVlrCxfT6wMM24uD7rrzWSD26RlfUOgeiPDQuBcZXt67a22RJef5Dpr"
      crossorigin="anonymous"
    ></script>

    <!-- Chart.js for creating charts -->
    <script
      src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.5.0/chart.umd.min.js"
      integrity="sha384-XcdcwHqIPULERb2yDEM4R0XaQKU3YnDsrTmjACBZyfdVVqjh6xQ4/DCMd7XLcA6Y"
      crossorigin="anonymous"
    ></script>

    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <header class="header">
      <h1 class="title">Survey</h1>
      <div class="status">
        <span id="badge" class="badge wait">loading…</span>
      </div>
      <div class="controls">
        <button id="loadResultsBtn" hidden>
          <span class="oi" data-glyph="list-rich" aria-hidden="true"></span>Results
        </button>
      </div>
    </header>

    <main>
      <!-- the survey's intro card, centred in the frame -->
      <section id="startScreen">
        <div class="intro-card">
          <h2 id="surveyTitle">Survey</h2>
          <p id="surveyDescription" class="description" hidden></p>
          <p id="surveySize" class="muted" hidden></p>
          <p id="startMessage" class="message" role="status"></p>
          <div class="intro-actions">
            <button id="startSurveyBtn" class="primary" disabled>
              <span class="oi" data-glyph="pencil" aria-hidden="true"></span><span class="text">Loading…</span>
            </button>
            <button id="retryBtn" hidden>
              <span class="oi" data-glyph="reload" aria-hidden="true"></span>Retry
            </button>
          </div>
        </div>
      </section>
      <section id="surveyContainer" hidden></section>
      <section id="resultsContainer" hidden></section>
      <section id="fieldSelectionContainer" hidden></section>
      <section id="chartsContainer" hidden></section>
    </main>

    <script src="./app.js"></script>
  </body>
</html>
